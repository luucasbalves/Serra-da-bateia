<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Lucas | Portfólio</title>
<link rel="icon" href="https://i.imgur.com/I6k1bBL.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Manrope', sans-serif;
  background: #F3EEEB;
  color: #1A1A1A;
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #DDD3CD;
  padding: 20px 0;
  z-index: 1000;
  transition: 0.3s ease;
}

.container {
  width: 90%;
  max-width: 1200px;
  margin: auto;
}

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: 900;
  font-size: 22px;
  color: #5A3A2E;
  letter-spacing: 1px;
}

/* NAV */
nav a {
  margin-left: 30px;
  text-decoration: none;
  color: #5A3A2E;
  font-weight: 600;
  position: relative;
  padding-bottom: 5px;
  font-size: 15px;
  letter-spacing: 0.5px;
}

nav a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  background: #92614B;
  left: 0;
  bottom: 0;
  transition: 0.3s;
}

nav a:hover::after {
  width: 100%;
}

/* HERO */
.hero {
  padding-top: 120px;
  min-height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://i.imgur.com/I6k1bBL.jpeg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.hero-overlay { max-width: 800px; }

.hero h1 {
  font-size: 42px;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.btn {
  display: inline-block;
  margin-top: 20px;
  background: #DDD3CD;
  color: #5A3A2E;
  padding: 14px 32px;
  text-decoration: none;
  font-weight: bold;
  border-radius: 4px;
  transition: 0.3s ease;
}

.btn:hover { background: white; }

/* SECTIONS */
.section { padding: 100px 0; }
.light { background: #DDD3CD; }

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}

/* IMAGENS */
img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
}

.grid-2 img {
  height: 380px;
  object-fit: cover;
}

/* CARDS */
.cards {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
  margin-top: 40px;
}

.card {
  background: white;
  padding: 30px;
  border-left: 5px solid #92614B;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  flex: 1 1 300px;
  transition: 0.3s;
}

.card:hover { transform: translateY(-6px); }

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 20px;
}

.card h3 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.8px;
  color: #5A3A2E;
  margin-bottom: 10px;
  text-transform: uppercase;
}

.card p {
  font-size: 15px;
  line-height: 1.6;
  color: #444;
  font-weight: 500;
}

/* GRID MATERIAIS */
.materiais-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 30px;
  margin-top: 50px;
}

.material-item {
  background: white;
  padding: 20px;
  text-align: center;
  border-top: 4px solid #92614B;
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
  transition: 0.3s;
}

.material-item:hover { transform: translateY(-5px); }

.material-item img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 15px;
}

.material-item h3 {
  font-size: 17px;
  font-weight: 700;
  color: #5A3A2E;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* MAPA */
.map-container iframe {
  width: 100%;
  height: 400px;
  border-radius: 8px;
  border: 0;
}

/* CONTATO */
.contato-container {
  display: flex;
  justify-content: center;
  text-align: center;
}

.contato-info { max-width: 600px; }

.contato-info h2 {
  font-size: 32px;
  color: #5A3A2E;
  margin-bottom: 10px;
}

.contato-sub {
  font-size: 16px;
  color: #555;
  margin-bottom: 40px;
}

.contato-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 18px;
  font-size: 16px;
  font-weight: 600;
  color: #333;
}

.contato-item i {
  color: #92614B;
  font-size: 18px;
}

.btn-contato {
  display: inline-block;
  margin-top: 30px;
  background: #5A3A2E;
  color: white;
  padding: 14px 35px;
  border-radius: 5px;
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.5px;
  transition: 0.3s ease;
}

.btn-contato:hover {
  background: #92614B;
  transform: translateY(-3px);
}

/* WHATSAPP */
.whatsapp-float {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #25D366;
  color: white;
  font-size: 28px;
  width: 60px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  z-index: 2000;
  transition: 0.3s;
}

.whatsapp-float:hover { transform: scale(1.1); }

footer {
  background: #5A3A2E;
  color: white;
  text-align: center;
  padding: 25px;
}

/* RESPONSIVO */
@media (max-width: 768px) {
  .grid-2 { grid-template-columns: 1fr; }
  .cards { flex-direction: column; }
  .materiais-grid { grid-template-columns: 1fr; }
}

</style>
</head>

<body>

<script>
window.addEventListener("scroll", function () {
  const header = document.getElementById("header");
  if (window.scrollY > 50) {
    header.style.boxShadow = "0 5px 25px rgba(0,0,0,0.3)";
  } else {
    header.style.boxShadow = "none";
  }
});
</script>

</body>
</html>

</body>
</html>
